appId: com.typewren.app
productName: Typewren
copyright: Copyright © 2026 Typewren Team

directories:
  output: release
  buildResources: build

files:
  - out/**
  - package.json

asar: true

win:
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Typewren
  uninstallDisplayName: Typewren

compression: maximum

# 更新源：electron-updater 运行时读打包内的 app-update.yml。
# 本地 npm run dist 只产出 release/ 安装包 + latest.yml，不自动发布（CI 无发布任务）。
# 手动发布（gh release upload）时 latest.yml 必须与安装包一并上传：
# electron-updater 按 releases/download/v<版本>/latest.yml 拉元数据，缺失即 404
# 报「检查更新失败」。或改用 electron-builder --publish always 自动上传全部产物。
publish:
  provider: github
  owner: ShiZiMiao
  repo: Typewren

fileAssociations:
  - ext: md
    name: Markdown
    description: Markdown 文档
    mimeType: text/markdown
  - ext: markdown
    name: Markdown
    description: Markdown 文档
    mimeType: text/markdown
  - ext: mdown
    name: Markdown
    description: Markdown 文档
    mimeType: text/markdown
