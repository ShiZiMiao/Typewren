appId: com.typewren.app
productName: Typewren
copyright: Copyright © 2026 Typewren Team

directories:
  output: release
  buildResources: build

files:
  - out/**
  - package.json

asar: true

win:
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Typewren
  uninstallDisplayName: Typewren

compression: maximum
