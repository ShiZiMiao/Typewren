appId: com.typewren.app
productName: Typewren
copyright: Copyright © 2026 Typewren Team

directories:
  output: release
  buildResources: build

files:
  - out/**
  - package.json

asar: true

win:
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Typewren
  uninstallDisplayName: Typewren

compression: maximum

# 更新源：electron-updater 运行时读打包内的 app-update.yml。
# 本地 npm run dist 不发布（只产出 latest.yml）；推送 GitHub 时经 CI 带 --publish 发布。
publish:
  provider: github
  owner: ShiZiMiao
  repo: Typewren

fileAssociations:
  - ext: md
    name: Markdown
    description: Markdown 文档
    mimeType: text/markdown
  - ext: markdown
    name: Markdown
    description: Markdown 文档
    mimeType: text/markdown
  - ext: mdown
    name: Markdown
    description: Markdown 文档
    mimeType: text/markdown
